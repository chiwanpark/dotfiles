- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.config/zsh: zsh
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.config/nvim/init.lua: vim/init.lua
    ~/.config/nvim/lua: vim/lua
    ~/.tmux.conf: tmux/tmux.conf
    ~/.ssh/config: ssh/config
    ~/.ssh/config.d: ssh/config.d
    ~/.pip/pip.conf: python/pip.conf
    ~/.config/btop/btop.conf: btop/btop.conf
    ~/.config/herdr/config.toml: herdr/config.toml
    ~/.config/niri/config.kdl: niri/config.kdl
    ~/.config/kime/config.yaml: kime/config.yaml
    ~/.config/environment.d/kime.conf: environment.d/kime.conf
    ~/.config/ghostty/config.ghostty: ghostty/config.ghostty
    ~/.config/waybar: waybar
    ~/.config/display-switch/display-switch.ini: display-switch/display-switch.ini
    ~/.config/systemd/user/display-switch.service: display-switch/display-switch.service
    ~/.local/bin/:
      glob: true
      path: bin/*

- shell:
    - command: [git pull, Updating dotfiles...]
      stdout: true
      stderr: true
    - command: [git submodule update --init --recursive --quiet, Updating submodules...]
      stdout: true
      stderr: true
    - command: [vim/install.sh, Initializing Vim...]
      stdout: true
      stderr: true
    - command: [btop/install.sh, Protecting btop configuration...]
      stdout: true
      stderr: true
    - command: [herdr/install.sh, Installing herdr...]
      stdout: true
      stderr: true
